[project]
name = "tarot-space"
version = "0.1.0"
description = "AI tarot reader: FastAPI + OpenAI function calling with a mobile-friendly web UI."
readme = "README.md"
authors = [
    { name = "ajaykotian", email = "ajaykotian7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "skyfield>=1.55",
    "tzdata>=2026.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
