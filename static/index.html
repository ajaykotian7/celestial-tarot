<!DOCTYPE html>
<html lang="en" data-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Celestial</title>
    <meta name="description" content="A family almanac: today's panchang and Rahu Kaal, your jataka, dashas and doshas, kundali matching, muhurats, festivals, and readings from the tarot, the cowries and the stars.">
    <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15151f" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Celestial">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Rozha+One&family=Tiro+Devanagari+Sanskrit&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Before first paint, so the page doesn't flash the wrong theme or size
        try {
            document.documentElement.dataset.theme = localStorage.getItem("tarot_theme") || "auto";
            document.documentElement.dataset.size = localStorage.getItem("tarot_text_size") || "normal";
        } catch (e) {}
    </script>
    <script type="module" src="/static/js/main.js"></script>
</head>

<body>
    <!-- The gate: a passphrase keeps the app to family -->
    <div id="gate" class="gate">
        <svg id="gate-kolam" class="kolam" aria-hidden="true"></svg>
        <h1>Celestial</h1>
        <p class="muted">Panchang · Jataka · Tarot · Kaudi</p>
        <form id="gate-form" autocomplete="on">
            <input type="password" id="gate-pin" class="input" placeholder="Passphrase" aria-label="Passphrase"
                autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
            <button class="btn wide" id="gate-btn" type="submit">Enter</button>
            <p id="gate-error" class="error" role="alert"></p>
        </form>
    </div>

    <div id="app" class="app" hidden>
        <header class="app-header">
            <button id="person-btn" class="person-chip" type="button" aria-label="Choose who this is for">
                <span id="person-avatar" class="avatar">?</span>
                <span id="person-name" class="who">Add someone</span>
                <span aria-hidden="true">▾</span>
            </button>
            <div id="header-title" class="header-title">Today</div>
            <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
                </svg>
            </button>
        </header>

        <main>
            <section id="tab-today" class="tab" aria-label="Today"></section>

            <section id="tab-ask" class="tab" aria-label="Ask" hidden>
                <div class="asking-about">
                    <span class="muted">Asking about</span>
                    <button id="ask-person" class="chip" type="button"></button>
                </div>
                <div class="ask-box">
                    <div id="topic-chips" class="chip-scroll" role="group" aria-label="Topic"></div>
                    <textarea id="question" maxlength="1000" aria-label="Your question" placeholder="Ask what is on your mind…"></textarea>
                    <div id="suggestions" class="suggestions"></div>
                    <div class="ask-actions">
                        <div id="method" class="seg" role="group" aria-label="How to read"></div>
                        <button id="ask-btn" class="btn" type="button">Ask</button>
                    </div>
                </div>

                <div id="reading" class="reading">
                    <div id="idle" class="empty">
                        <div class="diya" aria-hidden="true"><div class="flame"></div><div class="bowl"></div></div>
                        <p class="muted">Light a lamp, and ask.</p>
                    </div>
                    <div id="dasha-ribbon" class="dasha-ribbon" hidden></div>
                    <section class="table" aria-label="Reading table">
                        <div id="cards-tray" class="cards-tray"></div>
                        <ol id="spread-legend" class="spread-legend"></ol>
                        <div id="shuffler" class="animation-stage" aria-hidden="true">
                            <div class="deck-container">
                                <div class="shuffle-card card-back-art c1"></div>
                                <div class="shuffle-card card-back-art c2"></div>
                                <div class="shuffle-card card-back-art c3"></div>
                            </div>
                        </div>
                    </section>
                    <div id="tldr-box" class="tldr-box" hidden>
                        <div class="eyebrow">The takeaway</div>
                        <div id="tldr-text" class="tldr-text"></div>
                    </div>
                    <div id="chat-output" class="narrative" aria-live="polite"></div>
                    <div id="reading-actions" class="reading-actions" hidden>
                        <button id="share-btn" class="btn small ghost" type="button">Share</button>
                        <button id="copy-btn" class="btn small ghost" type="button">Copy</button>
                        <button id="new-btn" class="btn small" type="button">New question</button>
                    </div>
                    <form id="follow-up" class="follow-up" hidden>
                        <input id="follow-up-input" class="input" maxlength="1000" aria-label="Follow-up question" placeholder="Ask more about this reading…" autocomplete="off">
                        <button class="btn small" type="submit">Ask</button>
                    </form>
                </div>

                <section class="card" style="margin-top:22px">
                    <div class="card-head">
                        <h3>Past readings</h3>
                        <span id="journal-count" class="muted"></span>
                    </div>
                    <p id="journal-empty" class="hint">Readings for this person will be kept here, on this device.</p>
                    <ol id="journal-list" class="journal-list"></ol>
                </section>
            </section>

            <section id="tab-timeline" class="tab" aria-label="Timeline" hidden></section>
            <section id="tab-family" class="tab" aria-label="Family" hidden></section>
            <section id="tab-calendar" class="tab" aria-label="Calendar" hidden></section>
        </main>

        <nav class="tabbar" aria-label="Sections">
            <button class="tab-btn" type="button" data-tab="today" id="tab-btn-today">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
                Today
            </button>
            <button class="tab-btn" type="button" data-tab="ask" id="tab-btn-ask">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c2 3 3 4.6 3 6.4A3 3 0 0 1 12 12.5a3 3 0 0 1-3-3.1C9 7.6 10 6 12 3z"></path><path d="M4 15h16c0 3-3.6 5-8 5s-8-2-8-5z"></path></svg>
                Ask
            </button>
            <button class="tab-btn" type="button" data-tab="timeline" id="tab-btn-timeline">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20"></path><circle cx="12" cy="6" r="2"></circle><circle cx="12" cy="13" r="2"></circle><path d="M14 6h6M4 13h6M14 19h5"></path></svg>
                Timeline
            </button>
            <button class="tab-btn" type="button" data-tab="family" id="tab-btn-family">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17.5" cy="9.5" r="2.5"></circle><path d="M16 14.3c3 .3 5 2.6 5 5.7"></path></svg>
                Family
            </button>
            <button class="tab-btn" type="button" data-tab="calendar" id="tab-btn-calendar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><circle cx="12" cy="15.5" r="1.5"></circle></svg>
                Calendar
            </button>
        </nav>
    </div>

    <!-- Bottom sheets: pickers, forms and details -->
    <div id="sheet" class="sheet-overlay" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-handle" aria-hidden="true"></div>
            <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">✕</button>
            <h2 id="sheet-title"></h2>
            <div id="sheet-body"></div>
        </div>
    </div>

    <!-- Pre-reading ritual -->
    <div id="ritual" class="ritual" hidden>
        <div class="ritual-inner">
            <p id="ritual-question" class="ritual-question"></p>
            <div class="ritual-stage">
                <div id="breath-orb" class="breath-orb"></div>
                <svg id="ritual-sigil" class="sigil" aria-hidden="true" hidden></svg>
                <button id="ritual-cast" class="ritual-cast" type="button" hidden>🐚 Let the shells fall</button>
                <div id="cut-deck" class="cut-deck" hidden>
                    <button class="pile card-back-art" type="button" aria-label="Left pile"></button>
                    <button class="pile card-back-art" type="button" aria-label="Middle pile"></button>
                    <button class="pile card-back-art" type="button" aria-label="Right pile"></button>
                </div>
            </div>
            <p id="ritual-instruction" class="ritual-instruction" aria-live="polite"></p>
            <button id="ritual-skip" class="ritual-skip" type="button">Skip ritual</button>
        </div>
    </div>

    <!-- Enlarged card view -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-name" hidden>
        <figure class="lightbox-card">
            <img id="lightbox-img" alt="">
            <figcaption>
                <div id="lightbox-pos" class="card-pos"></div>
                <h3 id="lightbox-name"></h3>
                <div id="lightbox-orient" class="card-orient"></div>
                <p id="lightbox-meaning"></p>
                <p id="lightbox-personal" class="card-personal" hidden></p>
            </figcaption>
            <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close">✕</button>
        </figure>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <div id="print-area" class="print-area"></div>
</body>

</html>
